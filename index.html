<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driver Allocation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Barlow:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
html:root{
  --head:#1d2a36; --head-ink:#fff; --text:#1d2a36; --ink-text:#fff; --field:#fff; --side:#e7eae8; --bar:#eef0ef; --tabbg:#e9ecea;
  --rowline:#e3e7e5; --rowline-w:1px; --vline:0px; --zebra:transparent; --fs:15px; --cell-weight:400; --hook-weight:600; --rowpad:3px; --radius:6px;
  --steel:#dfe3e1; --panel:#f7f8f6; --ink:#1d2a36; --muted:#5d6b75; --line:#c3cac7;
  --tag:#f1c232; --tag-ink:#3a2e05; --clash:#c4302b; --clash-bg:color-mix(in srgb,var(--clash) 14%,var(--field));
  --warn:#9a6a00; --warn-bg:#fff3d1; --elec:#1f7a4d; --coll:#2b5c9e; --used:#cfd5d2; --used-ink:#56615c;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--steel);color:var(--text);font:var(--fs)/1.4 var(--body)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:1px}

header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:var(--headpad) 20px;background:var(--head);color:var(--head-ink)}
header h1{margin:0;font:700 var(--h1) /1 var(--display);letter-spacing:.01em}
.datebox{display:flex;align-items:center;gap:6px}
.datebox button{background:transparent;border:1px solid color-mix(in srgb,var(--head-ink) 35%,transparent);color:var(--head-ink);border-radius:6px;width:34px;height:34px}
.datebox input{background:color-mix(in srgb,var(--head-ink) 10%,transparent);border:1px solid color-mix(in srgb,var(--head-ink) 35%,transparent);color:var(--head-ink);border-radius:var(--radius);padding:5px 8px;color-scheme:var(--head-scheme,dark)}
.dayname{font:600 20px/1 var(--display);min-width:150px}
.spacer{flex:1}
.hbtn{background:color-mix(in srgb,var(--head-ink) 10%,transparent);border:1px solid color-mix(in srgb,var(--head-ink) 35%,transparent);color:var(--head-ink);border-radius:var(--radius);padding:6px 12px}
.histpanel{position:fixed;top:0;left:0;bottom:0;width:min(400px,94vw);z-index:9000;background:var(--panel);color:var(--text);border-right:1px solid var(--line);box-shadow:4px 0 24px rgba(0,0,0,.25);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.histpanel[hidden]{display:none}
.dlgback{position:fixed;inset:0;z-index:9500;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--panel);color:var(--text);border-radius:var(--radius);border-top:8px solid var(--clash);box-shadow:0 10px 40px rgba(0,0,0,.35);max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:16px 18px}
.dlg h3{margin:0 0 8px;font:700 20px var(--display)}
.dlg p{margin:6px 0 10px;font-size:15px}
.dlgrow{border:1px solid var(--line);border-left:6px solid var(--warn);border-radius:var(--radius);padding:8px 10px;margin:0 0 8px;font-size:14px}
.dlgrow label{display:flex;align-items:center;gap:8px;margin-top:6px}
.dlgrow select{flex:1;min-width:0}
.dlgerr{color:var(--clash);font-weight:600}
.dlgbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.dlgbtns button{padding:7px 14px;border-radius:var(--radius);border:1px solid var(--line);background:var(--field);color:var(--text);font-weight:600;cursor:pointer}
.dlgbtns .dlgok{background:var(--clash);color:var(--on-clash);border-color:var(--clash)}
.histhead{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--head);color:var(--head-ink)}
.histhead h2{margin:0;flex:1;font:700 20px var(--display);color:inherit}
.histhead button{background:none;border:0;color:inherit;font-size:22px;line-height:1;cursor:pointer;padding:2px 6px}
.histnote{margin:0;padding:8px 14px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.histlist{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1}
.histlist li{border-bottom:1px solid var(--rowline)}
.histlist button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:9px 14px;cursor:pointer;font:inherit}
.histlist button:hover{background:var(--field)}
.histlist .ht{display:block;font:600 13px var(--display);color:var(--muted)}
.histlist .hd{display:block;font-size:14px;word-break:break-word}
.histlist li.now button{background:color-mix(in srgb,var(--coll) 14%,transparent);box-shadow:inset 4px 0 0 var(--coll);cursor:default}
.histlist li.future button{opacity:.55}
.histlist li.future .hd{text-decoration:line-through;text-decoration-thickness:1px}
.histlist .hd{font-weight:600;font-size:15px;line-height:1.3}
.histlist .hmore{display:block;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.35}
.histlist .hmeta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:4px;font-size:12px;color:var(--muted)}
.hchip{font:700 11px var(--body);padding:1px 7px;border-radius:999px;background:var(--used);color:var(--used-ink)}
.hbadge{display:inline-block;font:700 11px var(--body);text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:4px;margin-bottom:4px}
.hbadge.here{background:var(--coll);color:var(--on-coll)}
.hbadge.undone{background:var(--used);color:var(--used-ink)}
.histlist li.empty{padding:14px;color:var(--muted)}
@media print{.histpanel{display:none!important}}
.hbtn:disabled{opacity:.45;cursor:default}
.hbtn:hover{background:color-mix(in srgb,var(--head-ink) 20%,transparent)}

.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 20px;background:var(--bar);color:var(--text);border-bottom:1px solid var(--line)}
.pill{border-radius:999px;padding:4px 12px;font-weight:600;font-size:14px;border:1px solid transparent}
.pill.ok{background:color-mix(in srgb,var(--elec) 15%,var(--field));color:var(--elec)}
.pill.bad{background:var(--clash-bg);color:var(--clash);border-color:color-mix(in srgb,var(--clash) 40%,transparent);cursor:pointer}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.copybar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 20px;background:var(--warn-bg);color:var(--text);border-bottom:1px solid color-mix(in srgb,var(--warn) 30%,var(--warn-bg))}
.copybar button{background:var(--ink);color:var(--ink-text);border:0;border-radius:6px;padding:7px 14px;font-weight:600}

nav{display:flex;gap:4px;padding:12px 20px 0;overflow-x:auto}
nav button{border:1px solid var(--line);border-bottom:0;background:var(--tabbg);border-radius:var(--radius) var(--radius) 0 0;padding:8px 16px;font:600 18px/1 var(--display);white-space:nowrap;position:relative}
nav button{color:var(--tab-ink)}nav button[aria-selected=true]{background:var(--tabsel);color:var(--tabsel-ink);box-shadow:0 1px 0 var(--tabsel)}
nav .offtab::after{content:"";position:absolute;left:6px;right:6px;bottom:0;height:4px;border-radius:2px 2px 0 0;background:var(--oc)}
nav .dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--clash)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 418px;gap:0;align-items:start}
main{background:var(--panel);border-top:1px solid var(--line);min-height:70vh;padding:18px 20px 40px}
aside{position:sticky;top:0;max-height:100vh;overflow:auto;scrollbar-gutter:stable;padding:16px;border-left:1px solid var(--line);background:var(--side)}
@media (max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}aside{position:static;max-height:none;border-left:0;border-top:1px solid var(--line)}}

h2{font:700 24px/1.1 var(--display);margin:0 0 4px}
h3{font:600 19px/1.1 var(--display);margin:26px 0 8px}
.sub{color:var(--muted);margin:0 0 14px}
.tablewrap{overflow-x:auto}
.tablewrap th{position:relative}
.topscroll{overflow-x:auto;overflow-y:hidden;height:14px;margin-bottom:2px;max-width:100%;flex:none}
.topscroll>div{height:1px}
.topscroll[hidden]{display:none}
@media print{.topscroll{display:none!important}}
.colgrip{position:absolute;top:0;right:-5px;width:11px;height:100%;cursor:col-resize;z-index:2;touch-action:none}
.colgrip::after{content:"";position:absolute;left:4px;top:20%;bottom:20%;width:3px;border-radius:2px;background:var(--muted);opacity:.35}
.colgrip:hover::after,body.colresizing .colgrip::after{opacity:1;background:var(--focus,#2a6)}
thead th:has(>.colgrip){position:relative}
body.colresizing{cursor:col-resize;user-select:none}
table.sized td :is(select,input).hook{width:100%}
@media print{.colgrip{display:none}}
table{border-collapse:collapse;width:100%;min-width:720px}
th{font:600 15px/1 var(--display);text-align:left;color:var(--muted);padding:6px 4px;border-bottom:2px solid var(--line)}
td{padding:var(--rowpad) 4px;border-bottom:var(--rowline-w) solid var(--rowline);border-right:var(--vline) solid var(--rowline);vertical-align:middle}
tbody tr:nth-child(even) td{background:var(--zebra)}
th{border-bottom-color:var(--rowline)!important}
.grip{display:inline-block;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;padding:6px 6px;border:1px solid color-mix(in srgb,var(--text) 40%,var(--line));border-radius:6px;white-space:nowrap}.gcol{margin-left:6px;padding:2px 6px}body.dragon,body.dragon *{cursor:grabbing!important;user-select:none}tr.dragging,th.dragging{opacity:.45}tr.dropat td{box-shadow:inset 0 3px 0 var(--elec)}th.dropat{box-shadow:inset 3px 0 0 var(--elec)}
td.n{width:34px;color:var(--muted);font:600 16px var(--display);text-align:right;padding-right:10px}
td input,td select{width:100%;border:1px solid transparent;background:transparent;border-radius:var(--radius);font-weight:var(--cell-weight);padding:5px 6px;min-width:0}
td input:hover,td select:hover{border-color:var(--line);background:var(--field)}
td select option{background:var(--field);color:var(--text)}
td input:focus,td select:focus{border-color:var(--focus);background:var(--field);outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--focus) 35%,transparent)}
td :is(select,input).hook{font-family:var(--display);font-size:calc(var(--fs) + 1px);font-weight:var(--hook-weight);width:140px}
.clash{background:var(--clash-bg)!important;border-color:color-mix(in srgb,var(--clash) 50%,transparent)!important;color:var(--clash)}
.unknown{background:var(--warn-bg)!important;border-color:color-mix(in srgb,var(--warn) 50%,transparent)!important}
td.x{width:30px}
td.x button{border:0;background:none;color:var(--del);font-size:18px;line-height:1;padding:4px}
td.x button:hover{color:var(--clash)}
.lookbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.lookbtns .addrow{margin:0}
.lookbtns button.arm1{background:#f1c232!important;color:#3a2e05!important;border-color:#b8900f!important}
.lookbtns button.arm2{background:#c4302b!important;color:#fff!important;border-color:#8e1f1b!important}
.addrow:disabled{opacity:.45;cursor:not-allowed}
.addrow{margin-top:8px;background:var(--field);border:1px solid color-mix(in srgb,var(--text) 45%,var(--line));border-radius:var(--radius);padding:5px 12px;color:var(--text);font-weight:600}.addrow:hover:not(:disabled){border-color:var(--ink);background:color-mix(in srgb,var(--ink) 10%,var(--field))}.addrow[aria-pressed="true"]{background:color-mix(in srgb,var(--ink) 16%,var(--field));border-color:var(--ink)}
.addrow:hover{border-color:var(--text);color:var(--text)}

/* hook board */
.board-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.board-head h2{font-size:22px}
.board-head .right{display:flex;align-items:center;gap:8px}
.popbtn{border:1px solid var(--line);background:var(--field);border-radius:var(--radius);padding:3px 9px;font-size:13px}
.popbtn:hover{border-color:var(--text)}
.boardctl[hidden],.platesearch[hidden]{display:none!important}
.board-head.tools-off{margin-bottom:16px}
body.popped .layout{grid-template-columns:minmax(0,1fr)}
body.popped aside{position:static;max-height:none;border-left:0;border-top:1px solid var(--line);padding:10px 20px}
.popnote{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
body.popwin{background:var(--side)}
body.popwin aside{position:static;max-height:none;border:0;min-height:100vh;padding-bottom:0}
body.popwin .groups{display:flex;flex-wrap:nowrap;gap:22px;align-items:flex-start;width:max-content}
body.popwin{overflow:hidden}
body.popwin aside{height:100vh;min-height:0;overflow:auto;box-sizing:border-box}
body.popwin .board-head,body.popwin .legend,body.popwin .boardtools,body.popwin .sizetools,body.popwin .arrangenote{position:sticky;left:0;width:max-content;max-width:calc(100vw - 48px)}
body.popwin .board-head{width:calc(100vw - 48px);max-width:1000px}
body.popwin .where{left:0;width:calc(100vw - 48px);box-sizing:border-box}
body.popwin .hookgap{display:none}
body.popwin .hooks{grid-template-columns:repeat(6,56px);grid-auto-rows:50px}
body.popwin .boardtools{max-width:none}
body.popwin .boardtools button{flex:0 0 auto;padding:5px 14px;white-space:nowrap}
body.popwin .grp{flex:0 0 auto}
body.popwin .groups{zoom:var(--popzoom,1)}
.sizetools{display:flex;align-items:center;gap:6px;margin:0 0 12px;font-size:13px;color:var(--muted)}
.sizetools button{border:1px solid var(--line);background:var(--field);border-radius:var(--radius);min-width:30px;height:28px;padding:0 8px;font-size:15px}
.sizetools button:hover{border-color:var(--text)}
.sizetools output{min-width:42px;text-align:center;font-weight:600;color:var(--text)}
body.popwin .board-head,body.popwin .legend,body.popwin .boardtools{max-width:1000px}
body.popwin .boardtools{max-width:480px}
body.popwin .where{position:sticky;bottom:0;background:var(--side);padding:10px 0 12px;margin:10px 0 0;border-top:1px solid var(--line);font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);margin:6px 0 12px}
.legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.hooks{display:grid;grid-template-columns:repeat(6,56px);grid-auto-rows:50px;gap:6px;justify-content:start}
.grouplab{font:600 15px var(--display);color:var(--muted);margin:0 0 6px}
.tag .num.long{font-size:14px;letter-spacing:-.02em}
.tag .num.xlong{font-size:10px;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.opt{font-style:normal;font-size:12px;opacity:.75}
.vferr:not(:empty){background:var(--clash-bg);border-radius:var(--radius);padding:6px 10px}
.kindtag{display:block;font:500 11px var(--body);color:var(--muted)}
html.nooffcol nav .offtab::after{display:none}
.tag .sharedot{position:absolute;top:2px;right:5px;color:var(--clash);font:900 16px/1 Arial,Helvetica,sans-serif}
.tag.oos .sharedot{color:var(--on-clash)}
.slot{border-radius:5px 5px 14px 14px;min-height:50px}
.slot.gone{border:1px dashed color-mix(in srgb,var(--line) 60%,transparent)}
.boardtools{flex-wrap:wrap}
.slot.drop{border:2px dashed var(--line);background:color-mix(in srgb,var(--field) 50%,transparent)}
.slot.over,.tag.movable.over{outline:3px solid var(--coll);outline-offset:1px}
.tag.movable{cursor:grab}
.tag.dragging{opacity:.4}
.tag.picked{outline:3px dashed var(--text);outline-offset:2px;transform:translateY(-2px)}
.arrangenote{font-size:13px;color:var(--text);background:var(--warn-bg);border-radius:var(--radius);padding:6px 10px;margin:-4px 0 10px}
.hookgap{border:0;border-top:2px solid var(--line);margin:10px 0}
.tag{position:relative;border:0;border-radius:5px 5px 14px 14px;padding:12px 2px 5px;background:var(--tag);color:var(--tag-ink);font:700 18px/1 var(--display);text-align:center}
.tag::before{content:"";position:absolute;top:4px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--side);box-shadow:inset 0 1px 1px rgba(0,0,0,.35)}
.tag .tagtop{display:block}
.tag .num{display:block}
.tag .off:empty{display:none}
.tag .off{position:absolute;top:2px;left:2px;font:700 9px/1 var(--body);padding:1px 2px;background:none!important;opacity:.9;border-radius:3px;background:color-mix(in srgb,currentColor 16%,transparent)}
.tag small.long{font-size:9px;letter-spacing:-.03em}
.tag small{letter-spacing:-.02em;display:block;font:500 11px/1.2 var(--body);opacity:.85;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag .bolt{position:absolute;right:4px;bottom:4px;font-size:11px;line-height:1;filter:drop-shadow(1px 0 0 var(--elec)) drop-shadow(-1px 0 0 var(--elec)) drop-shadow(0 1px 0 var(--elec)) drop-shadow(0 -1px 0 var(--elec))}
.legend .lbolt{display:inline-block}.legend .lbolt i{font-style:normal;display:inline-block;filter:drop-shadow(1px 0 0 var(--elec)) drop-shadow(-1px 0 0 var(--elec)) drop-shadow(0 1px 0 var(--elec)) drop-shadow(0 -1px 0 var(--elec))}
.legend .lbolt::before{display:none}
.legend .lsplit::before{background:linear-gradient(90deg,var(--warn) 50%,var(--off-W2) 50%)}
.tag.used{background:var(--used);color:var(--used-ink)}
.tag.oos{background:var(--clash);color:var(--on-clash)}
.tag.coll{background:var(--coll);color:var(--on-coll)}
.tag.oth{background:var(--oth);color:var(--on-oth)}
.tag.chg{background:var(--warn);color:var(--on-warn)}
.oblock{--ob:var(--line);border:1px solid var(--line);border-left:8px solid var(--ob);border-radius:var(--radius);background:color-mix(in srgb,var(--ob) 7%,var(--panel));padding:0 14px 14px;margin:0 0 18px}
.oblock.ob-oos{--ob:var(--clash)}.oblock.ob-chg{--ob:var(--warn)}.oblock.ob-coll{--ob:var(--coll)}.oblock.ob-oth{--ob:var(--oth)}.oblock.ob-keys{--ob:var(--muted)}
.obhead{display:flex;align-items:center;gap:10px;margin:0 -14px 8px;padding:9px 14px;background:color-mix(in srgb,var(--ob) 26%,var(--panel));color:var(--text);border-bottom:2px solid var(--ob)}
.obhead h3{margin:0;color:inherit;font-size:20px;display:flex;align-items:center;gap:8px}
.obhead h3::before{content:"";width:14px;height:14px;border-radius:3px;background:var(--ob);flex:none}
.obcount{margin-left:auto;font:600 13px var(--body);background:var(--panel);border:1px solid var(--ob);padding:2px 9px;border-radius:999px}
.oblock>.note{margin:4px 0 8px}
.oblock .addrow{margin-bottom:0}
td :is(select,input).hook.chgsel,td :is(select,input).hook.chgsel:hover,td :is(select,input).hook.chgsel:focus{background:var(--warn);color:var(--on-warn);border-color:var(--warn)}
.chgnote{display:block;font-size:11px;font-weight:600;line-height:1.1;margin:1px 0 0 6px;color:var(--warn)}
.tag.dup{outline:3px solid var(--clash);outline-offset:1px}
.tag.hl{outline:3px solid var(--text);outline-offset:1px}
.tag.qdim{opacity:.18;filter:grayscale(1)}
.tag.qhit{outline:3px solid var(--qhit);outline-offset:1px}
.tag.qhit.hl{outline-color:var(--text)}
.platesearch{display:flex;align-items:center;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.platesearch input{flex:1 1 180px;max-width:280px;border:1px solid var(--line);border-radius:var(--radius);background:var(--field);color:var(--text);padding:6px 8px;font:700 15px/1.2 Arial,Helvetica,sans-serif;letter-spacing:.05em;text-transform:uppercase}
.platesearch input::placeholder{text-transform:none;letter-spacing:0;font-weight:400}
body.popwin .platesearch{position:sticky;left:0;width:max-content;max-width:calc(100vw - 48px)}
.boardtools{display:flex;gap:6px;margin:0 0 10px}
.boardtools button{flex:0 0 auto;white-space:nowrap;border:1px solid var(--line);background:var(--field);border-radius:var(--radius);padding:4px 6px;font-size:13px}
.boardtools button[aria-pressed=true]{background:var(--ink);color:var(--ink-text);border-color:var(--ink)}
.where{min-height:22px;font-size:13px;color:var(--muted);margin:10px 0 0}
.sharenote{display:block;color:var(--clash);font-weight:600;margin-bottom:3px}
.golink{color:var(--coll);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.golink:hover{color:var(--text)}
@keyframes flash{from{box-shadow:inset 0 0 0 3px var(--tag);background:color-mix(in srgb,var(--tag) 30%,transparent)}to{box-shadow:inset 0 0 0 3px transparent;background:transparent}}

.bulkdlg table{width:100%;border-collapse:collapse;font-size:14px}.bulkdlg th,.bulkdlg td{text-align:left;padding:6px;border-bottom:1px solid var(--rowline);vertical-align:top}
.bulkdlg td input[type=text]{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--field);color:var(--text)}
.bulkdlg td select{border:1px solid var(--line);border-radius:6px;padding:4px;background:var(--field);color:var(--text)}
.bkst{display:inline-block;border-radius:10px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.bkst.new{background:#d8f0dc;color:#1d5c2a}.bkst.dup{background:#f6d5d5;color:#7a1f1f}.bkst.maybe{background:#fbe8c4;color:#6b4a00}
.bkm{font-size:12px;color:var(--muted);margin-top:3px}.bkm b{color:var(--text)}
.bulkdlg .bksum{margin:8px 0;font-weight:600}
.bulkdlg .bkall{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--field)}
.bulkdlg .bkall label{display:inline-flex;gap:6px;align-items:center}
.bulkdlg .bkallset{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.bulkdlg .bkall select{border:1px solid var(--line);border-radius:6px;padding:4px;background:var(--field);color:var(--text)}
.bulkdlg tr.bkon td{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.bkbtn{border:1px solid var(--ink);background:var(--field);color:var(--text);border-radius:var(--radius);padding:6px 12px;font-weight:600;cursor:pointer}
.dnlink{border:0;background:none;padding:0;text-align:left;font:inherit;font-weight:600;color:var(--text);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}.dnlink:hover{text-decoration-color:var(--text)}
.nsrow{display:inline-flex;align-items:center;gap:4px;font-size:13px;white-space:nowrap;cursor:pointer}.nsbox{display:inline-flex;align-items:center;gap:6px;padding:6px 0}
.nstag{display:inline-block;background:#d8f0dc;color:#1d5c2a;border-radius:10px;padding:1px 7px;font-size:12px;font-weight:700}
.azsort{display:inline-flex;align-items:center}.azsort button{border:1px solid var(--line);background:var(--field);color:var(--text);padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;margin:0}.azsort button+button{border-left:0}.azsort .note+button{border-radius:var(--radius) 0 0 var(--radius)}.azsort button:last-child{border-radius:0 var(--radius) var(--radius) 0}.azsort button[aria-pressed=true]{background:var(--ink);color:var(--ink-text);border-color:var(--ink)}
.azbar{display:flex;flex-wrap:wrap;gap:3px;margin:8px 0}.azbar button{min-width:30px;padding:5px 6px;border:1px solid var(--line);background:var(--field);color:var(--text);border-radius:6px;font-weight:600;cursor:pointer}.azbar button[aria-pressed=true]{background:var(--ink);color:var(--ink-text);border-color:var(--ink)}.azbar button:disabled{opacity:.3;cursor:default}
.offbar button.offb{border-left:5px solid var(--oc)}.offbar button small{opacity:.7;font-weight:400}.offbar button:disabled{opacity:.4;cursor:default}
.rdrow{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding:6px 2px;border-bottom:1px solid var(--rowline)}

input.offday:not(.clash){background:color-mix(in srgb,var(--warn) 13%,var(--field));box-shadow:inset 3px 0 0 var(--warn)}
.dpi.dpoff{opacity:.6}
.rseg{display:inline-flex;flex-wrap:wrap;gap:4px}

.rseg button[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:var(--on-warn,#fff)}

.rdrow.offtoday{background:color-mix(in srgb,var(--warn) 12%,transparent)}
.rdoff{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--warn);color:#fff;font-size:12px;font-weight:700}
.rdday{margin:6px 0 10px;font-size:15px}
.rotaunset{font-weight:600}
.rotasum{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin:6px 0 8px;font-size:14px}

/* ---------- phone layout ----------
   Only used on a touch screen under 760px wide, or a phone turned on its side (html.mob is set by the script).
   Desktop never gets the class, so nothing below changes the desktop look. */
.mobonly{display:none}
input[data-lock]{cursor:pointer}
.walkdlg{border-top-color:var(--warn)}
.walkdlg:focus{outline:none}
.walkdlg b{white-space:nowrap}
.phonebox{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:18px}.phonebox .addrow{margin-top:0} /* Settings box that only appears on a phone */
@media screen{
html.mob{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.mob button,html.mob select,html.mob input{touch-action:manipulation}
html.mob .mobonly{display:block}
/* header: title + undo/redo/more, then the date, then the More buttons when open */
html.mob header{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));align-items:center;gap:8px 6px;padding:10px 10px 12px}
html.mob #helpBtn{grid-column:5/7;grid-row:1;height:38px;padding:0 4px;font-weight:600}
html.mob header h1{grid-column:1/5;grid-row:1;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.mob header .spacer{display:none}
html.mob #undoBtn,html.mob #redoBtn{grid-row:1;font-size:0;height:38px;padding:0}
html.mob #undoBtn{grid-column:7/9}html.mob #redoBtn{grid-column:9/11}
html.mob #undoBtn::before{content:"↶";font-size:21px;line-height:1}
html.mob #redoBtn::before{content:"↷";font-size:21px;line-height:1}
html.mob #moreBtn{grid-column:11/13;grid-row:1;height:38px;padding:0 4px;font-weight:600}
html.mob #moreBtn[aria-expanded=true]{background:var(--head-ink);color:var(--head)}
html.mob header:has(#exportBtn.due) #moreBtn{position:relative}
html.mob header:has(#exportBtn.due) #moreBtn::after{content:"";position:absolute;top:-4px;right:-4px;width:11px;height:11px;border-radius:50%;background:var(--due-dot,var(--tag));box-shadow:0 0 0 2px var(--head)}
html.mob .datebox{grid-column:1/-1;grid-row:2;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:6px}
html.mob .datebox>button{width:auto;height:40px;font-size:20px}
html.mob .datebox .calbtn{width:100%;height:40px;font-weight:600;font-size:16px}
html.mob .datebox .dayname{display:none}
html.mob #histBtn,html.mob #printBtn,html.mob #exportBtn,html.mob #importBtn{display:none;height:40px}
html.mob header.hmore #histBtn,html.mob header.hmore #printBtn,html.mob header.hmore #exportBtn,html.mob header.hmore #importBtn{display:block;width:100%}
html.mob header.hmore #histBtn{grid-column:1/7;grid-row:3}html.mob header.hmore #printBtn{grid-column:7/13;grid-row:3}
html.mob header.hmore #exportBtn{grid-column:1/7;grid-row:4}html.mob header.hmore #importBtn{grid-column:7/13;grid-row:4}
html.mob .status{padding:8px 10px;gap:6px}
html.mob .pill{font-size:13px;padding:3px 10px}
html.mob .copybar{padding:10px}
html.mob .copybar button{min-height:40px}
/* office tabs stay at the top of the screen while scrolling */
html.mob nav{position:sticky;top:0;z-index:60;background:var(--steel);padding:8px 10px 0;scrollbar-width:none;box-shadow:0 1px 0 var(--line)}
html.mob nav::-webkit-scrollbar{display:none}
html.mob nav button{font-size:17px;padding:10px 13px}
/* one column: the Key Cupboard has its own tab on a phone */
html.mob .layout{display:block}
html.mob main{padding:14px 10px 32px;min-height:60vh}
html.mob #board{display:none}
html.mob.mobboard main{display:none}
html.mob.mobboard #board{display:block;position:static;max-height:none;overflow:visible;border:0;padding:14px 10px 32px;min-height:60vh}
html.mob [data-popout]{display:none}
html.mob h2{font-size:23px}
html.mob .topscroll,html.mob .colgrip,html.mob .celltip{display:none!important}
html.mob .addrow{min-height:40px}
html.mob .offtools{gap:6px}
html.mob .offtools .addrow{font-size:14px;padding:5px 10px}
html.mob input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]),html.mob select,html.mob textarea{font-size:16px} /* stops the phone zooming in when you tap a box */
html.mob .toast{width:max-content;max-width:calc(100vw - 24px);text-align:center;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
/* the office tables (and OOS tab tables) become one card per row */
html.mob table.mcard{display:block;width:auto!important;min-width:0!important;table-layout:auto!important}
html.mob table.mcard thead{display:none}
html.mob table.mcard tbody{display:block}
html.mob table.mcard tr{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 36px;gap:8px 6px;align-items:end;background:var(--field);border:1px solid var(--line);border-radius:var(--radius);padding:8px 8px 10px;margin:0 0 8px}
html.mob table.mcard td{display:block;padding:0;border:0!important;background:none!important;min-width:0;width:auto}
html.mob table.mcard td[data-label]::before{content:attr(data-label);display:block;font:600 12.5px/1.2 var(--body);color:var(--muted);margin:0 0 3px 2px}
html.mob table.mcard td{position:relative}
html.mob table.mcard td[data-label]::before{line-height:22px;margin-bottom:2px}
html.mob table.mcard .hookcell .vdbtn,html.mob table.mcard .namecell .dhbtn{position:absolute;top:-3px;right:2px;z-index:2;width:28px;height:28px;font-size:14px}
html.mob table.mcard td:has(.vdbtn,.dhbtn)[data-label]::before{margin-right:34px}
html.mob table.mcard td.n{grid-row:1;grid-column:1;text-align:left;padding:0;font-size:17px;line-height:42px}
html.mob table.mcard td.x{grid-row:1;grid-column:4;justify-self:end}
html.mob table.mcard td.x button{width:36px;height:42px;font-size:24px;padding:0}
html.mob table.mcard td input,html.mob table.mcard td select{min-height:42px;border-color:var(--line);background:var(--field)}
html.mob table.mcard td :is(select,input).hook{width:auto;flex:1 1 auto;min-width:0;font-size:17px}
html.mob table.mcard .hookcell,html.mob table.mcard .namecell{gap:6px}
html.mob .vdbtn,html.mob .dhbtn{width:30px;height:30px;font-size:15px}
html.mob .nmclr{width:30px;height:30px;font-size:19px;line-height:30px}
html.mob .nmwrap input:has(+ .nmclr){padding-right:36px}
html.mob .nmclr.arm1,html.mob .nmclr.arm2{width:30px;min-width:30px;font-size:14px}
html.mob table.mcard tr.flash td{animation:none}
html.mob table.mcard tr.flash{animation:mflash 2.2s ease-out}
@keyframes mflash{from{box-shadow:inset 0 0 0 3px var(--tag);background:color-mix(in srgb,var(--tag) 30%,var(--field))}to{box-shadow:inset 0 0 0 3px transparent;background:var(--field)}}
@media (prefers-reduced-motion:reduce){html.mob table.mcard tr.flash{animation:none;background:color-mix(in srgb,var(--tag) 30%,var(--field))}}
/* where each box sits in the card: row 1 is number, main box, remove; then two boxes side by side */
html.mob .mc-main td:nth-child(5){grid-row:1;grid-column:2/4}
html.mob .mc-main td:nth-child(5) input{font:600 18px var(--display)}
html.mob .mc-main td:nth-child(2){grid-row:2;grid-column:1/3}
html.mob .mc-main td:nth-child(3){grid-row:2;grid-column:3/5}
html.mob .mc-main td:nth-child(6){grid-row:3;grid-column:1/3}
html.mob .mc-main td:nth-child(4){grid-row:3;grid-column:3/5}
html.mob .mc-extra td:nth-child(2),html.mob .mc-pm td:nth-child(2),html.mob .mc-oos td:nth-child(2),html.mob .mc-chg td:nth-child(2),html.mob .mc-oth td:nth-child(2),html.mob .mc-coll td:nth-child(2){grid-row:1;grid-column:2/4}
html.mob .mc-extra td:nth-child(3),html.mob .mc-oos td:nth-child(3){grid-row:2;grid-column:1/3}
html.mob .mc-extra td:nth-child(4),html.mob .mc-oos td:nth-child(4){grid-row:2;grid-column:3/5}
html.mob .mc-pm td:nth-child(3),html.mob .mc-chg td:nth-child(3),html.mob .mc-oth td:nth-child(3){grid-row:2;grid-column:1/5}
html.mob .mc-coll tr{padding-bottom:8px}
html.mob table.mcard td>select,html.mob table.mcard td>:is(select,input).hook{width:100%}

}

/* help overlay */
#helpOv{position:fixed;inset:0;z-index:9900;pointer-events:none;background:rgba(10,15,25,.55);font:500 14px/1.35 var(--body,system-ui)}
#helpOv svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hlbox{position:absolute;border:3px solid #ffd43b;border-radius:8px;pointer-events:none;background:rgba(255,212,59,.12)}
.hlnote{position:absolute;max-width:240px;background:#fff8c5;color:#1d1d1d;border:2px solid #e0b300;border-radius:10px;padding:7px 10px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.hlnote b{display:block;margin-bottom:2px;font-size:14px}
.hlbar{pointer-events:auto;position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:#1d1d1d;color:#fff;padding:8px 10px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.4);white-space:nowrap}
.hlbar button{border:0;border-radius:999px;padding:7px 14px;font:700 14px var(--body,system-ui);cursor:pointer;background:#ffd43b;color:#1d1d1d}
.hlbar button:disabled{opacity:.35;cursor:default}.hlbar .hlx{background:#fff}
.hlempty{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:#fff8c5;color:#1d1d1d;padding:14px 18px;border-radius:12px;max-width:320px;text-align:center}

/* Column headings: when a column is shrunk the heading splits onto 2 lines only at its set break (Hook./Reg., Hook/No., Duty/No., Reg./No., Usual/Driver, Substitute/(If any), CDV/Partner, Not/Used) (Ash, 5 Oct 2026) */
.thw{white-space:nowrap}
html:not(.mob) table.offtbl.colfix>thead>tr>th{white-space:normal;line-height:1.15}
/* fixed-height top rows (desktop layout): top bar, status strip, office tabs never grow or shrink */
html:not(.mob) header{flex-wrap:nowrap;height:calc(var(--headpad)*2 + 44px);box-sizing:border-box;min-width:0}
html:not(.mob) header>*{flex-shrink:0}
html:not(.mob) header h1{flex-shrink:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html:not(.mob) header .spacer{flex:1 1 0;min-width:0}
html:not(.mob) header .hbtn{white-space:nowrap}
html:not(.mob) .status{flex-wrap:nowrap;height:48px;box-sizing:border-box;padding-top:0;padding-bottom:0;overflow-x:auto;overflow-y:hidden;white-space:nowrap}
html:not(.mob) .status>*{flex-shrink:0}
html:not(.mob) nav#tabs{height:48px;box-sizing:border-box;flex-wrap:nowrap;align-items:flex-end;overflow-y:hidden}
html:not(.mob) nav#tabs button{flex-shrink:0}

/* hide / show the Key Cupboard (desktop layout) */
.kcshow{display:none}
html:not(.mob) body.kcoff .layout{grid-template-columns:minmax(0,1fr)}
html:not(.mob) body.kcoff #board{display:none}
html:not(.mob) body.kcoff .kcshow{display:block;position:fixed;right:0;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;z-index:40;padding:12px 7px;border:1px solid var(--line);border-right:0;border-radius:var(--radius) 0 0 var(--radius);background:var(--side,var(--panel));color:var(--text);font:600 14px var(--body);cursor:pointer;box-shadow:-2px 2px 8px rgba(0,0,0,.15)}
@media print{.kcshow{display:none!important}}

/* office tables: every row is exactly the same height (Settings > Row height). Nothing inside a cell can make it taller:
   the box stays at the top and any extra line (usual van, usual cover, notes) sits in the bottom strip of the cell. */
html:not(.mob) table.offtbl{table-layout:auto}
html:not(.mob) table.offtbl>tbody>tr{height:var(--rowh)}
html:not(.mob) table.offtbl>tbody>tr>td{height:var(--rowh);max-height:var(--rowh);padding-top:0;padding-bottom:0;position:relative;vertical-align:middle;box-sizing:border-box;overflow:hidden}
html:not(.mob) table.offtbl>tbody>tr>td>*{max-height:var(--rowh);overflow:hidden}
/* suggestions sit beside the box on the same line, so they show at every row height */
html:not(.mob) table.offtbl>tbody>tr>td:has(>*+*){white-space:nowrap}
html:not(.mob) table.offtbl>tbody>tr>td:has(>*+*)>*{display:inline-flex;vertical-align:middle;align-items:center}
html:not(.mob) table.offtbl>tbody>tr>td:has(>*+*)>*:first-child{width:auto;min-width:140px}
html:not(.mob) table.offtbl>tbody>tr>td>*+*{margin:0 0 0 4px!important;max-height:var(--rowh)}
html:not(.mob) table.offtbl .hooktips{flex-wrap:nowrap;overflow:hidden}
html:not(.mob) table.offtbl .hooktip{flex-shrink:0;line-height:1.3;padding-top:0;padding-bottom:0}

function boardLayout(){ // numbered hooks sit at their number; hire/custom vans fill any empty space
  const cells=[];const pos={};
  db.vans.filter(v=>vkind(v)==="hook").forEach(v=>{const i=v.h-1;if(cells[i]==null){cells[i]=v.h;pos[v.h]=i}});
  const lastHook=cells.length;
  const others=db.vans.filter(v=>vkind(v)!=="hook").sort(vsort);
  const unplaced=[];
  others.forEach(v=>{if(Number.isInteger(v.slot)&&v.slot>=0&&cells[v.slot]==null){cells[v.slot]=v.h;pos[v.h]=v.slot}else unplaced.push(v)});
  unplaced.forEach(v=>{let i=lastHook;while(cells[i]!=null)i++;cells[i]=v.h;pos[v.h]=i});
  let total=Math.max(42,Math.ceil(cells.length/42)*42);

}

/* 3-click safety: 1st click arms (amber), 2nd click red, 3rd click applies. Resets after 4s idle. */
/* every remove button needs 3 clicks: 1st amber, 2nd red, 3rd removes. Resets after 4s. */
function armed(btn){ // btn.dataset.armverb changes the wording ("clear", "reset"...); default "remove"
  const n=(+btn.dataset.armn||0)+1;clearTimeout(btn._armT);
  if(btn.dataset.armlabel==null){btn.dataset.armlabel=btn.textContent;btn.dataset.armtitle=btn.getAttribute("title")||""}
  if(n>=3){disarm(btn);return true}
  const small=btn.dataset.armlabel.trim().length<=1,verb=btn.dataset.armverb||"remove";
  btn.dataset.armn=n;btn.classList.toggle("arm1",n===1);btn.classList.toggle("arm2",n===2);
  if(btn.querySelector(".pmglyph")||btn._armHTML!=null){if(btn._armHTML==null)btn._armHTML=btn.innerHTML;btn.innerHTML=pmNum(n===1?2:1)}else
  btn.textContent=small?(n===1?"2":"1"):(n===1?"Click 2 more times":`Click once more to ${verb}`);
  btn.title=n===1?`Click 2 more times to ${verb}`:`Click once more to ${verb}`;
  btn._armT=setTimeout(()=>disarm(btn),4000);return false}
function disarm(btn){if(!btn)return;clearTimeout(btn._armT);btn.dataset.armn=0;btn.classList.remove("arm1","arm2");
  if(btn._armHTML!=null){btn.innerHTML=btn._armHTML;btn._armHTML=null;delete btn.dataset.armlabel}else
  if(btn.dataset.armlabel!=null){btn.textContent=btn.dataset.armlabel;delete btn.dataset.armlabel}
  if(btn.dataset.armtitle!=null){if(btn.dataset.armtitle)btn.title=btn.dataset.armtitle;else btn.removeAttribute("title");delete btn.dataset.armtitle}}
function tripleClick(btn,action){
  if(!btn)return;const label=btn.textContent;let n=0,t;
  const reset=()=>{n=0;btn.textContent=label;btn.classList.remove("arm1","arm2")};
  btn.onclick=()=>{clearTimeout(t);n++;
    if(n===1){btn.textContent="Click 2 more times";btn.classList.add("arm1")}
    else if(n===2){btn.textContent="Click once more to confirm";btn.classList.remove("arm1");btn.classList.add("arm2")}
    else{reset();action();return}
    t=setTimeout(reset,4000)};
}

/* width a column of the small tables (ADDITIONAL VEHICLES REQUIRED, 1PM VANS…) needs to show its longest entry */
/* Keep a fixed-width table exactly as wide as its columns add up to. Some browsers (Firefox) squeeze every column a
   little when the table's width comes out a pixel or two short of the column total, which made column edges jump left
   when you started dragging one. This measures the real columns and tops the table width up (Ash, 5 Oct 2026). */
function tblWidthFix(tb,set){try{if(!tb||!tb.tHead||!tb.tHead.rows[0])return;
  for(let n=0;n<3;n++){const cols=[...tb.querySelectorAll(":scope>colgroup>col")];if(!cols.length)return;
    const want=cols.reduce((t,c)=>t+(parseFloat(c.style.width)||0),0),have=[...tb.tHead.rows[0].cells].reduce((t,c)=>t+c.getBoundingClientRect().width,0),d=want-have;
    if(!want||Math.abs(d)<.5)return;set(tb.getBoundingClientRect().width+d)}}catch(e){}}
function smallNeed(tb,i){let w=0;
  /* measure text with a hidden copy in the box's own font and letter spacing, so the column fits exactly (Ash, 5 Oct 2026) */
  const tw=(cs,v)=>{const sp=smallNeed.s||(smallNeed.s=document.createElement("span"));sp.style.cssText="position:absolute;left:-99999px;top:0;visibility:hidden;white-space:pre;padding:0;border:0;margin:0";
    ["fontFamily","fontSize","fontWeight","fontStyle","fontStretch","letterSpacing","wordSpacing","textTransform"].forEach(k=>{try{sp.style[k]=cs[k]}catch(e){}});sp.textContent=v;if(!sp.isConnected)document.body.appendChild(sp);return sp.getBoundingClientRect().width};

function setupColResize(){
  const CW=db.colW||{};
  $("main").querySelectorAll(".tablewrap>table").forEach(tb=>{
    const ths=[...tb.querySelectorAll("thead th")];if(ths.length<3)return;
    /* the main W2–W12 tables have their own column sizing (the bars in each heading); leave them alone or they'd get a second set of columns */
    if(tb.querySelector("thead [data-colrs]"))return;
    const key=ths.map(t=>t.textContent.trim()).join("|");
    /* widths go on <col> elements (like the main table), so dragging only changes one column and stays smooth */
    let cg=null;const cols=()=>{if(!cg){cg=document.createElement("colgroup");ths.forEach(()=>cg.appendChild(document.createElement("col")));tb.insertBefore(cg,tb.firstChild)}return [...cg.children]};
    const apply=ws=>{const C=cols();tb.classList.add("sized");tb.style.tableLayout="fixed";tb.style.minWidth="0";tb.style.maxWidth="none";tb.style.width=Math.round(ws.reduce((x,y)=>x+y,0))+"px";C.forEach((c,i)=>c.style.width=Math.round(ws[i])+"px");tblWidthFix(tb,w=>tb.style.width=w+"px")};
    const clear=()=>{tb.classList.remove("sized");tb.style.tableLayout=tb.style.minWidth=tb.style.width=tb.style.maxWidth="";if(cg){cg.remove();cg=null}};
    if(CW[key]&&CW[key].length===ths.length)apply(CW[key]);
    ths.forEach((th,i)=>{if(!th.textContent.trim())return;
      const g=document.createElement("span");g.className="colgrip";g.title="Drag to make wider or narrower. Double-click to reset.";th.appendChild(g);
      g.onpointerdown=e=>{e.preventDefault();e.stopPropagation();

        const x0=e.clientX,w0=ws[i];try{g.setPointerCapture(e.pointerId)}catch(_){}document.body.classList.add("colresizing");

          if(!raf)raf=requestAnimationFrame(()=>{raf=0;const C=cols();C[i].style.width=Math.round(ws[i])+"px";tb.style.width=Math.round(ws.reduce((x,y)=>x+y,0))+"px";tblWidthFix(tb,w=>tb.style.width=w+"px")})};
        g.onpointerup=g.onpointercancel=()=>{g.onpointermove=g.onpointerup=g.onpointercancel=null;document.body.classList.remove("colresizing");if(!moved){if(started){if(CW[key]&&CW[key].length===ths.length)apply(CW[key]);else clear()}return}db.colW=db.colW||{};db.colW[key]=ws.map(Math.round);save()};};
      /* double-click: fit this column to its longest entry; double-click again to put it back */
      g.ondblclick=e=>{e.stopPropagation();db.colW=db.colW||{};const ws=ths.map(t=>Math.round(t.getBoundingClientRect().width)),fit=smallNeed(tb,i);
        const prevK=key+"#prev"+i;if(db.colW[prevK]!=null&&Math.abs(ws[i]-fit)<=2){ws[i]=db.colW[prevK];delete db.colW[prevK];toast("Column put back")}else{db.colW[prevK]=ws[i];ws[i]=fit;toast("Column fitted. Double-click again to put it back")}
        db.colW[key]=ws;apply(ws);save()};
    });
  });
}

/* click (or tap / Enter) on a ! to read its reason in a small box, as well as hovering */
(()=>{const close=()=>{const p=document.querySelector(".whypop");if(p)p.remove()};
  const open=el=>{close();const t=el.getAttribute("title")||el.getAttribute("aria-label")||"";if(!t)return;
    const p=document.createElement("div");p.className="whypop";p.setAttribute("role","dialog");p.innerHTML=`<button type="button" aria-label="Close">×</button>`;
    const d=document.createElement("div");d.textContent=t;p.appendChild(d);document.body.appendChild(p);
    const r=el.getBoundingClientRect(),W=document.documentElement.clientWidth,H=document.documentElement.clientHeight;
    let x=Math.min(W-p.offsetWidth-8,Math.max(8,r.left+r.width/2-p.offsetWidth/2)),y=r.bottom+8;if(y+p.offsetHeight>H-8)y=Math.max(8,r.top-8-p.offsetHeight);
    p.style.left=x+"px";p.style.top=y+"px";p._for=el};
  document.addEventListener("click",e=>{const v=e.target.closest&&e.target.closest(".vshare");const p=document.querySelector(".whypop");
    if(v){e.preventDefault();e.stopPropagation();if(p&&p._for===v)close();else open(v);return}
    if(p&&!e.target.closest(".whypop .x-keep"))close()},true);
  document.addEventListener("keydown",e=>{if(e.key==="Escape")close();else if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("vshare")){e.preventDefault();open(e.target)}});
  addEventListener("scroll",close,true);addEventListener("resize",close)})();

</script>
</body>
</html>
